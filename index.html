<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcards anglais – Adjectifs</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1f1b3a;--mut:#6b6890;--pri:#6c4cf1;--ok:#1f9d63;--mid:#e6a100;--ko:#e24b4b;--bd:#ddd8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15132a;--card:#211e3d;--tx:#f1efff;--mut:#a19dc8;--pri:#9a82ff;--bd:#383462}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px;text-align:center}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stats{display:flex;gap:8px;margin-bottom:12px;font-size:13px;color:var(--mut)}
.stats div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:24px 16px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pic{font-size:96px;line-height:1}
.ipa{font-size:28px;font-family:"Segoe UI","Noto Sans",system-ui,sans-serif;letter-spacing:.5px}
.word{font-size:34px;font-weight:700;color:var(--pri)}
.fr{font-size:18px;color:var(--mut)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
button.b{padding:12px 16px;border-radius:12px;border:0;font-size:16px;cursor:pointer;color:#fff;background:var(--pri);flex:1;min-width:90px}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.ko{background:var(--ko)}.mid{background:var(--mid)}.ok{background:var(--ok)}
.hint{font-size:13px;color:var(--mut)}
.list .it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.it .e{font-size:32px}.it .t{flex:1}.it .t b{display:block}.it .t span{font-size:14px;color:var(--mut)}
.it .lv{font-size:12px;color:var(--mut)}
.it button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.foot{text-align:center;margin-top:16px}
.foot button{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px}
</style></head><body><main>
<h1>🇬🇧 Les 26 adjectifs – Prononciation</h1>
<nav><button id="n1" class="on">Réviser</button><button id="n2">Liste</button></nav>
<div id="app"></div>
<div class="foot"><button id="reset">Tout remettre à zéro</button></div>
</main>
<script>
const C=[
["frightening","ˈfraɪtənɪŋ","effrayant","😱"],["angry","ˈæŋɡri","en colère","😠"],["scared","skeəd","effrayé","😨"],
["self-centred","ˌselfˈsentəd","égocentrique","🪞"],["kind","kaɪnd","gentil","🤗"],["calm","kɑːm","calme","😌"],
["clever","ˈklevə","intelligent","🧠"],["strong","strɒŋ","fort","💪"],["sociable","ˈsəʊʃəbəl","sociable","🥳"],
["amusing","əˈmjuːzɪŋ","amusant","😂"],["caring","ˈkeərɪŋ","attentionné","🫶"],["relaxed","rɪˈlækst","détendu","😎"],
["mean","miːn","méchant","😒"],["heartless","ˈhɑːtləs","sans cœur","🧊"],["dynamic","daɪˈnæmɪk","dynamique","⚡"],
["mindless","ˈmaɪndləs","irréfléchi","🥴"],["brave","breɪv","courageux","🦁"],["selfish","ˈselfɪʃ","égoïste","🎁"],
["shy","ʃaɪ","timide","🙈"],["weak","wiːk","faible","🥀"],["proud","praʊd","fier","🏆"],
["crazy","ˈkreɪzi","fou","🤪"],["heartbroken","ˈhɑːtˌbrəʊkən","le cœur brisé","💔"],["naive","naɪˈiːv","naïf","🐣"],
["narcissistic","ˌnɑːsɪˈsɪstɪk","narcissique","🤳"],["evil","ˈiːvəl","diabolique","😈"]];
const KEY="flashcards-adjectifs-v1",DAYS=[0,1,2,4,7,14];
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const st=i=>S[i]||{box:-1,due:0};
let tab=1,queue=[],cur=null,shown=false,voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>x.lang==="en-GB")||v.find(x=>x.lang.startsWith("en"))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(w,slow){if(!("speechSynthesis" in window))return alert("Audio non disponible sur ce navigateur.");
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-GB";if(voice)u.voice=voice;u.rate=slow?.5:.85;speechSynthesis.speak(u)}
function build(){const n=Date.now();queue=C.map((_,i)=>i).filter(i=>st(i).due<=n);
queue.sort((a,b)=>st(a).box-st(b).box);cur=queue.length?queue[0]:null;shown=false}
function rate(q){const s=st(cur),n=Date.now();
if(q===0){s.box=0;s.due=n+60000;queue.push(cur)}
else if(q===1){s.box=Math.max(0,s.box);s.due=n+10*60000;}
else{s.box=Math.min(5,s.box+1);s.due=n+DAYS[s.box]*864e5;if(s.box===0)s.due=n+864e5}
if(q===1&&queue.length>1)queue.push(cur);
S[cur]=s;save();queue.shift();cur=queue.length?queue[0]:null;shown=false;render()}
function render(){const a=document.getElementById("app");
document.getElementById("n1").className=tab==1?"on":"";document.getElementById("n2").className=tab==2?"on":"";
if(tab==2){a.innerHTML='<div class="list">'+C.map((c,i)=>{const b=st(i).box;return `<div class="it"><span class="e">${c[3]}</span><div class="t"><b>${c[0]}</b><span>/${c[1]}/ · ${c[2]}</span></div><span class="lv">${b<0?"nouvelle":"niv. "+(b+1)+"/6"}</span><button data-s="${i}" aria-label="Écouter">🔊</button></div>`}).join("")+"</div>";
a.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>say(C[b.dataset.s][0]));return}
const n=Date.now();let nw=0,du=0,ma=0;C.forEach((_,i)=>{const s=st(i);if(s.box<0)nw++;else if(s.box>=4)ma++;if(s.box>=0&&s.due<=n)du++});
let h=`<div class="stats"><div><b>${nw}</b>nouvelles</div><div><b>${du}</b>à revoir</div><div><b>${ma}</b>maîtrisées</div></div>`;
if(cur===null){h+=`<div class="card"><div class="pic">🎉</div><div class="word">Bravo !</div><div class="fr">Plus de cartes à réviser pour l’instant. Reviens plus tard ou réécoute la liste.</div></div>`;a.innerHTML=h;return}
const c=C[cur];
h+=`<div class="card"><div class="pic">${c[3]}</div><div class="ipa">/${c[1]}/</div>`;
if(!shown){h+=`<div class="hint">Écoute, répète à voix haute, puis vérifie.</div><div class="row"><button class="b alt" id="p1">🔊 Écouter</button><button class="b alt" id="p2">🐢 Lent</button></div><div class="row"><button class="b" id="rv">Voir la réponse</button></div>`}
else{h+=`<div class="word">${c[0]}</div><div class="fr">${c[2]}</div><div class="row"><button class="b alt" id="p1">🔊 Écouter</button><button class="b alt" id="p2">🐢 Lent</button></div><div class="hint">Tu l’as bien prononcé ?</div><div class="row"><button class="b ko" data-r="0">À revoir</button><button class="b mid" data-r="1">Difficile</button><button class="b ok" data-r="2">Facile</button></div>`}
h+="</div>";a.innerHTML=h;
const p1=document.getElementById("p1"),p2=document.getElementById("p2");
p1.onclick=()=>say(c[0]);p2.onclick=()=>say(c[0],true);
const rv=document.getElementById("rv");if(rv)rv.onclick=()=>{shown=true;render();say(c[0])};
a.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(+b.dataset.r))}
document.getElementById("n1").onclick=()=>{tab=1;build();render()};
document.getElementById("n2").onclick=()=>{tab=2;render()};
document.getElementById("reset").onclick=()=>{if(confirm("Effacer toute la progression ?")){S={};save();build();render()}};
build();render();
</script></body></html>
